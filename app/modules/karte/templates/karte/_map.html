<div class="s-map s-map-page" data-karte data-world="{{ url_for('karte.world') }}" data-status="{{ url_for('karte.status') }}" data-upload="{{ url_for('karte.upload') }}" data-image="{{ url_for('karte.image') }}" data-marks="{{ url_for('karte.marks') }}" data-tiles="{{ (tiles or {})|tojson|forceescape }}" data-tile-url="{{ url_for('karte.index') }}kacheln" data-csrf="{{ csrf_token() }}">
  <div class="s-map-bar">
    <label class="btn btn-sm btn-primary mb-0"><i class="fas fa-upload mr-1"></i>Spielstand<input id="s-map-file" type="file" accept=".sav" hidden></label>
    <span id="s-map-status" class="small text-muted d-inline-flex align-items-center flex-wrap" style="gap: .3rem;"></span>
    <span class="s-map-tools ml-auto" role="toolbar" aria-label="Zeichnen">
      <span class="btn-group btn-group-sm">
        <button type="button" class="btn btn-secondary" data-tool="move" title="Verschieben und anklicken" aria-label="Verschieben"><i class="fas fa-hand-paper"></i></button>
        <button type="button" class="btn btn-secondary" data-tool="pen" title="Freihand zeichnen" aria-label="Freihand"><i class="fas fa-pencil-alt"></i></button>
        <button type="button" class="btn btn-secondary" data-tool="line" title="Gerade Linie, z. B. für Bänder oder Schienen" aria-label="Linie"><i class="fas fa-slash"></i></button>
        <button type="button" class="btn btn-secondary" data-tool="rect" title="Bereich, z. B. für eine Fabrik" aria-label="Bereich"><i class="fas fa-vector-square"></i></button>
        <button type="button" class="btn btn-secondary" data-tool="pin" title="Markierung mit Text" aria-label="Markierung"><i class="fas fa-map-marker-alt"></i></button>
        <button type="button" class="btn btn-secondary" data-tool="erase" title="Zeichnung anklicken und löschen" aria-label="Löschen"><i class="fas fa-eraser"></i></button>
      </span>
      <span class="s-map-colors"></span>
      <select class="custom-select custom-select-sm s-map-width" data-map-width title="Strichstärke" aria-label="Strichstärke"></select>
    </span>
    <span class="btn-group btn-group-sm">
      <button type="button" class="btn btn-secondary" data-map-zoom-out title="Rauszoomen" aria-label="Rauszoomen"><i class="fas fa-minus"></i></button>
      <button type="button" class="btn btn-secondary" data-map-zoom-in title="Reinzoomen" aria-label="Reinzoomen"><i class="fas fa-plus"></i></button>
      <button type="button" class="btn btn-secondary" data-map-fit title="Ganze Karte" aria-label="Ganze Karte"><i class="fas fa-globe-europe"></i></button>
      <button type="button" class="btn btn-secondary" data-map-panel title="Ebenen" aria-label="Ebenen"><i class="fas fa-layer-group"></i></button>
      <button type="button" class="btn btn-secondary" data-map-full title="Vollbild" aria-label="Vollbild"><i class="fas fa-expand"></i></button>
    </span>
  </div>
  <div class="s-map-stage">
    <canvas></canvas>
    <div class="s-map-layers"></div>
    <div class="s-map-info" hidden></div>
  </div>
</div>
