<div class="tab-pane fade" id="karte">
  <div class="s-map" data-karte data-world="{{ url_for('karte.world') }}" data-status="{{ url_for('karte.status') }}" data-upload="{{ url_for('karte.upload') }}" data-image="{{ url_for('karte.image') }}" data-csrf="{{ csrf_token() }}">
    <div class="s-map-bar">
      <label class="btn btn-sm btn-primary mb-0"><i class="fas fa-upload mr-1"></i>Spielstand<input id="s-map-file" type="file" accept=".sav" hidden></label>
      <span id="s-map-status" class="small text-muted"></span>
      <span class="btn-group btn-group-sm ml-auto">
        <button type="button" class="btn btn-secondary" data-map-zoom-out title="Rauszoomen" aria-label="Rauszoomen"><i class="fas fa-minus"></i></button>
        <button type="button" class="btn btn-secondary" data-map-zoom-in title="Reinzoomen" aria-label="Reinzoomen"><i class="fas fa-plus"></i></button>
        <button type="button" class="btn btn-secondary" data-map-fit title="Ganze Karte" aria-label="Ganze Karte"><i class="fas fa-globe-europe"></i></button>
        <button type="button" class="btn btn-secondary" data-map-panel title="Ebenen" aria-label="Ebenen"><i class="fas fa-layer-group"></i></button>
        <button type="button" class="btn btn-secondary" data-map-full title="Vollbild" aria-label="Vollbild"><i class="fas fa-expand"></i></button>
      </span>
    </div>
    <div class="s-map-stage">
      <canvas></canvas>
      <div class="s-map-layers"></div>
      <div class="s-map-info" hidden></div>
    </div>
  </div>
</div>
