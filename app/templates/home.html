{% extends "base.html" %}
{% block title %}Übersicht{% endblock %}
{% block content %}
<div class="row">
  {% for m in cards %}
  <div class="col-sm-6 col-lg-4 col-xl-3 mb-3">
    <a class="card tile h-100 text-center" href="{{ url_for(m.endpoint) }}">
      <div class="card-body">
        <i class="fas {{ m.icon }} fa-3x text-warning mb-3"></i>
        <h5 class="card-title">{{ m.label }}</h5>
        <p class="card-text text-muted">{{ m.description }}</p>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
